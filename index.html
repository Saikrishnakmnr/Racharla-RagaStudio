<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RagaBrand - AI Music & Lyrics Generator</title>
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        .glass {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .neon-glow {
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
        }
        @keyframes pulse-slow {
            0%, 100% { transform: scale(1); opacity: 0.4; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }
        .bg-glow {
            animation: pulse-slow 8s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen font-sans relative overflow-x-hidden selection:bg-purple-500 selection:text-white">

    <!-- Decorative Background Glows -->
    <div class="absolute top-[-10%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-purple-900/20 blur-[120px] bg-glow"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[50vw] h-[50vw] rounded-full bg-blue-900/20 blur-[120px] bg-glow" style="animation-delay: -4s;"></div>

    <!-- Main Container -->
    <div class="max-w-6xl mx-auto px-4 py-8 relative z-10 min-h-screen flex flex-col justify-between">
        
        <!-- Header -->
        <header class="flex flex-col sm:flex-row justify-between items-center gap-4 pb-6 border-b border-slate-800/60 mb-8">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-purple-600 to-blue-500 flex items-center justify-center neon-glow">
                    <i class="fa-solid fa-compact-disc text-2xl text-white animate-spin" style="animation-duration: 8s;"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-200 to-purple-400">RagaBrand</h1>
                    <p class="text-xs text-slate-400 tracking-widest uppercase">Powered by <span class="text-purple-400 font-semibold">RacharlaGPT</span></p>
                </div>
            </div>
            
            <a href="https://youtube.com" target="_blank" class="flex items-center gap-2 bg-red-600/10 hover:bg-red-600/20 border border-red-500/30 px-4 py-2 rounded-full text-xs font-medium tracking-wide transition-all duration-300 group text-red-400">
                <i class="fa-brands fa-youtube text-red-500 group-hover:scale-110 transition-transform"></i>
                Subscribe on YouTube
            </a>
        </header>

        <!-- Application Body Grid -->
        <main class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start my-auto">
            
            <!-- Left Side: Controls & Input -->
            <div class="lg:col-span-5 flex flex-col gap-6">
                <div class="glass p-6 rounded-2xl relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-full h-[2px] bg-gradient-to-r from-transparent via-purple-500 to-transparent"></div>
                    
                    <h2 class="text-lg font-semibold mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-sliders text-purple-400 text-sm"></i> Setup Dashboard
                    </h2>

                    <!-- API Key Input -->
                    <div class="mb-4">
                        <label class="block text-xs font-medium text-slate-400 uppercase tracking-wider mb-2">Gemini Free API Key</label>
                        <div class="relative">
                            <input type="password" id="apiKeyInput" placeholder="AIzaSy..." class="w-full bg-slate-900/80 border border-slate-700/50 rounded-xl px-4 py-3 pl-10 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-purple-500 transition-all">
                            <i class="fa-solid fa-key absolute left-3.5 top-3.5 text-slate-500 text-xs"></i>
                        </div>
                        <p class="text-[11px] text-slate-500 mt-1.5">Your key remains securely inside your own local browser.</p>
                    </div>

                    <!-- Genre Picker -->
                    <div class="mb-4">
                        <label class="block text-xs font-medium text-slate-400 uppercase tracking-wider mb-2">Target Genre</label>
                        <select id="genreSelect" class="w-full bg-slate-900/80 border border-slate-700/50 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-purple-500 transition-all appearance-none cursor-pointer">
                            <option value="Cinematic Synthwave">Neon Synthwave (80s Analog)</option>
                            <option value="Modern Melodic EDM">Melodic EDM (Festival Anthems)</option>
                            <option value="Lo-Fi Chill Hop">Lo-Fi Study Beat (Warm Vinyl)</option>
                            <option value="Acoustic Pop Ballad">Emotional Pop Ballad (Piano & Strings)</option>
                            <option value="Dark Underground Hip-Hop">Dark Trap / Hip-Hop (Heavy Bass)</option>
                        </select>
                    </div>

                    <!-- Prompt / Input Idea -->
                    <div class="mb-5">
                        <label class="block text-xs font-medium text-slate-400 uppercase tracking-wider mb-2">Song Concept / Vibe</label>
                        <textarea id="conceptInput" rows="3" placeholder="e.g., A lonely astronaut looking at Earth, realization of time passing, deep emotional space aesthetic..." class="w-full bg-slate-900/80 border border-slate-700/50 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-purple-500 transition-all resize-none"></textarea>
                    </div>

                    <!-- Generate Button -->
                    <button id="generateBtn" onclick="generateMusicAndLyrics()" class="w-full bg-gradient-to-r from-purple-600 to-blue-600 hover:from-purple-500 hover:to-blue-500 text-white font-medium py-3.5 px-4 rounded-xl transition-all duration-300 flex items-center justify-center gap-2 tracking-wide font-semibold text-sm shadow-lg shadow-purple-900/20 active:scale-[0.99]">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                        Generate Track & Lyrics
                    </button>
                </div>

                <!-- Music Player Control Deck -->
                <div class="glass p-5 rounded-2xl relative overflow-hidden">
                    <h2 class="text-sm font-semibold mb-3 flex items-center gap-2 text-slate-300">
                        <i class="fa-solid fa-waveform text-blue-400"></i> RagaBrand Audio Monitor
                    </h2>
                    
                    <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-4 flex flex-col gap-4">
                        <div class="flex items-center justify-between">
                            <div>
                                <h3 id="playerTitle" class="text-sm font-medium text-white truncate max-w-[200px]">No Track Loaded</h3>
                                <p id="playerGenre" class="text-xs text-slate-400">Select vibe and generate</p>
                            </div>
                            <!-- Playback Action Buttons -->
                            <div class="flex items-center gap-2">
                                <button id="playBtn" onclick="togglePlayback()" disabled class="w-10 h-10 rounded-full bg-slate-800 border border-slate-700 text-slate-400 flex items-center justify-center transition-all cursor-not-allowed hover:text-white hover:border-purple-500">
                                    <i id="playIcon" class="fa-solid fa-play ml-0.5"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Custom Reactive Progress Simulation -->
                        <div class="w-full">
                            <div class="w-full bg-slate-800 rounded-full h-1.5 overflow-hidden">
                                <div id="audioProgress" class="bg-gradient-to-r from-purple-500 to-blue-500 h-full w-0 transition-all duration-300"></div>
                            </div>
                            <div class="flex justify-between items-center text-[10px] text-slate-500 mt-1">
                                <span id="timeCurrent">0:00</span>
                                <span id="timeTotal">0:00</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Side: Generated Output Terminal -->
            <div class="lg:col-span-7 flex flex-col gap-4 h-full">
                <div class="glass p-6 rounded-2xl flex flex-col h-[610px] relative">
                    
                    <!-- Tabs -->
                    <div class="flex border-b border-slate-800/80 pb-3 mb-4 gap-4">
                        <button id="tabLyricsBtn" onclick="switchTab('lyrics')" class="text-sm font-medium text-purple-400 border-b-2 border-purple-500 pb-2 transition-all px-1">
                            <i class="fa-solid fa-file-audio mr-1.5"></i>Studio Lyrics
                        </button>
                        <button id="tabPromptBtn" onclick="switchTab('prompt')" class="text-sm font-medium text-slate-400 hover:text-slate-200 pb-2 transition-all px-1">
                            <i class="fa-solid fa-sliders mr-1.5"></i>Suno / Udio Prompts
                        </button>
                    </div>
